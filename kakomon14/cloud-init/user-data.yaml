- path: /opt/kakomon14/provisioning/10-base.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\n# 対応: isucon14/provisioning/ansible/roles/base/tasks/main.yml L1-4\nset_timezone() {\n  if [ \"$(timedatectl show -p Timezone --value)\" != \"UTC\" ]; then\n    timedatectl set-timezone UTC\n    log \"timezone: changed to UTC\"\n  else\n    log \"timezone: already UTC\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/base/tasks/main.yml L13-20\nset_sysctl_port_range() {\n  local conf=/etc/sysctl.d/99-isuren.conf\n  local content='net.ipv4.ip_local_port_range = 10000 65535'\n  if [ ! -f \"${conf}\" ] || [ \"$(cat \"${conf}\")\" != \"${content}\" ]; then\n    echo \"${content}\" >\"${conf}\"\n    sysctl --system >/dev/null\n    log \"sysctl: changed ${conf}\"\n  else\n    log \"sysctl: already up to date\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/base/tasks/main.yml L22-33\nset_limits() {\n  local conf=/etc/security/limits.d/99-isuren.conf\n  local content\n  content=$(\n    cat <<'EOD'\n* - nofile 655360\n* - nproc 655360\n* soft memlock unlimited\n* hard memlock unlimited\nEOD\n  )\n  if [ ! -f \"${conf}\" ] || [ \"$(cat \"${conf}\")\" != \"${content}\" ]; then\n    echo \"${content}\" >\"${conf}\"\n    log \"limits: changed ${conf}\"\n  else\n    log \"limits: already up to date\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/base/tasks/main.yml L35-43\n# ホスト名はxiv.isucon.netではなくxiv.isuren.internalを使う。\n# .internalはICANNが私設ネットワーク専用に予約したTLD(.localと違いmDNSの特殊扱いを受けない)で、\n# webapp/go・frontendにisucon.net依存箇所がないため置き換えても実害がないことを確認済み。\nset_hosts() {\n  local marker='127.0.0.1 isuride.xiv.isuren.internal'\n  if ! grep -qF \"${marker}\" /etc/hosts; then\n    {\n      echo \"\"\n      echo \"# ISURIDE IP for matching requests\"\n      echo \"${marker}\"\n    } >>/etc/hosts\n    log \"hosts: added ${marker}\"\n  else\n    log \"hosts: already present\"\n  fi\n}\n\n# 未対応(意図的に除外): isucon14/provisioning/ansible/roles/base/tasks/main.yml L6-11\n# /etc/ssh/sshd_config.d/pubkey.conf に PubkeyAcceptedAlgorithms=+ssh-rsa を配置するタスク。\n# 旧クライアント互換のための設定で、bastionからの接続は最新クライアント前提のため除外。\n\nset_timezone\nset_sysctl_port_range\nset_limits\nset_hosts\n\nlog \"10-base.sh: done\"\n"
- path: /opt/kakomon14/provisioning/20-user.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\n# 対応: isucon14/provisioning/ansible/roles/isucon-user/tasks/main.yml L2-8\ncreate_group() {\n  if ! getent group \"${ISUREN_USER}\" >/dev/null 2>&1; then\n    groupadd -g 1100 \"${ISUREN_USER}\"\n    log \"group: created ${ISUREN_USER}(gid=1100)\"\n  else\n    log \"group: already exists\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/isucon-user/tasks/main.yml L10-20\n# password(平文isucon)設定は未対応。bastionはSSHキー/sudo経由の運用でログインパスワード認証を使わないため。\ncreate_user() {\n  if ! id -u \"${ISUREN_USER}\" >/dev/null 2>&1; then\n    useradd -u 1100 -g \"${ISUREN_USER}\" -d \"/home/${ISUREN_USER}\" -m -s /bin/bash \"${ISUREN_USER}\"\n    log \"user: created ${ISUREN_USER}(uid=1100)\"\n  else\n    log \"user: already exists\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/isucon-user/tasks/main.yml L22-26\nchmod_home() {\n  local home=\"/home/${ISUREN_USER}\"\n  if [ \"$(stat -c %a \"${home}\")\" != \"755\" ]; then\n    chmod 0755 \"${home}\"\n    log \"home: chmod 755 ${home}\"\n  else\n    log \"home: already 755\"\n  fi\n}\n\n# 未対応(意図的に除外): isucon14/provisioning/ansible/roles/isucon-user/tasks/main.yml L28-41\n# .sshディレクトリ作成・authorized_keys削除。bastionのユーザーアクセスモデル(ubuntu/user101経由)とは別物のため。\n\n# 対応: isucon14/provisioning/ansible/roles/isucon-user/tasks/main.yml L43-50\nset_sudoers() {\n  local conf=\"/etc/sudoers.d/99-${ISUREN_USER}-user\"\n  local content=\"${ISUREN_USER}  ALL=(ALL) NOPASSWD:ALL\"\n  if [ ! -f \"${conf}\" ] || [ \"$(cat \"${conf}\")\" != \"${content}\" ]; then\n    local tmp\n    tmp=\"$(mktemp)\"\n    echo \"${content}\" >\"${tmp}\"\n    visudo -cf \"${tmp}\"\n    install -m 0440 -o root -g root \"${tmp}\" \"${conf}\"\n    rm -f \"${tmp}\"\n    log \"sudoers: changed ${conf}\"\n  else\n    log \"sudoers: already up to date\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/isucon-user/tasks/main.yml L52-59, templates/env.sh\nset_env_sh() {\n  local dest=\"/home/${ISUREN_USER}/env.sh\"\n  local content\n  content=$(\n    cat <<'EOD'\nISUCON_DB_HOST=\"127.0.0.1\"\nISUCON_DB_PORT=\"3306\"\nISUCON_DB_USER=\"isucon\"\nISUCON_DB_PASSWORD=\"isucon\"\nISUCON_DB_NAME=\"isuride\"\n\n# マッチング間隔（秒）\nISUCON_MATCHING_INTERVAL=0.5\nEOD\n  )\n  if [ ! -f \"${dest}\" ] || [ \"$(cat \"${dest}\")\" != \"${content}\" ]; then\n    echo \"${content}\" >\"${dest}\"\n    chown \"${ISUREN_USER}:${ISUREN_USER}\" \"${dest}\"\n    chmod 0755 \"${dest}\"\n    log \"env.sh: changed ${dest}\"\n  else\n    log \"env.sh: already up to date\"\n  fi\n}\n\ncreate_group\ncreate_user\nchmod_home\nset_sudoers\nset_env_sh\n\nlog \"20-user.sh: done\"\n"
- path: /opt/kakomon14/provisioning/30-runtime.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\nISUREN_HOME=\"/home/${ISUREN_USER}\"\nMISE_BIN=\"${ISUREN_HOME}/.local/bin/mise\"\n\n# 対応: isucon14/provisioning/ansible/roles/xbuild/tasks/main.yml L1-9(git/xbuild導入部分)の代替。\n# xbuildはバージョン固定インストールをするだけのツールなのでmiseに置き換える。\ninstall_mise() {\n  if [ ! -x \"${MISE_BIN}\" ]; then\n    runuser -u \"${ISUREN_USER}\" -- sh -c 'curl -fsSL https://mise.run | sh'\n    log \"mise: installed\"\n  else\n    log \"mise: already installed\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/xbuild/tasks/main.yml L37-45(.profileへのPATH追加)相当\nset_bashrc() {\n  local bashrc=\"${ISUREN_HOME}/.bashrc\"\n  # shellcheck disable=SC2016 # .bashrcに文字通り書き込むため展開させない\n  local line='eval \"$(~/.local/bin/mise activate bash)\"'\n  if ! grep -qF \"${line}\" \"${bashrc}\" 2>/dev/null; then\n    echo \"${line}\" >>\"${bashrc}\"\n    chown \"${ISUREN_USER}:${ISUREN_USER}\" \"${bashrc}\"\n    log \"bashrc: added mise activate\"\n  else\n    log \"bashrc: already configured\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/xbuild/tasks/main.yml L27-30(go-install 1.23.2)の代替。\n# バージョンはpreflight-checkの決定(go 1.26.5)に固定。frontendはAMI上でビルドしなくなったため\n# node/pnpmは不要(kakomon14/scripts/mise.toml側で管理。80-frontend.sh参照)。\n# aws-bastionリポジトリのパスを直接参照せず実体をisurenのホームにコピーするのは、\n# /home/ubuntu配下へのisurenからのアクセス権限に依存させないため、および将来cloud-init化した際に\n# aws-bastionリポジトリ自体が存在しない前提でも動くようにするため。\nset_mise_config() {\n  local conf=\"${ISUREN_HOME}/.config/mise/config.toml\"\n  if [ ! -f \"${conf}\" ] || ! diff -q \"${SCRIPT_DIR}/mise.ami.toml\" \"${conf}\" >/dev/null 2>&1; then\n    install -d -m 0755 -o \"${ISUREN_USER}\" -g \"${ISUREN_USER}\" \"$(dirname \"${conf}\")\"\n    install -m 0644 -o \"${ISUREN_USER}\" -g \"${ISUREN_USER}\" \"${SCRIPT_DIR}/mise.ami.toml\" \"${conf}\"\n    log \"mise config: changed ${conf}\"\n  else\n    log \"mise config: already up to date\"\n  fi\n}\n\n# チェックサムを固定してサプライチェーン改ざん検知・再現性を担保する。\n# linux-arm64のみを対象にしているのはこのAMIがarm64(Graviton)専用のため。\n# `mise lock -g -p linux-arm64`で生成したものをgit管理し、そのまま配置する。\nset_mise_lock() {\n  local lock=\"${ISUREN_HOME}/.config/mise/mise.lock\"\n  if [ ! -f \"${lock}\" ] || ! diff -q \"${SCRIPT_DIR}/mise.ami.lock\" \"${lock}\" >/dev/null 2>&1; then\n    install -m 0644 -o \"${ISUREN_USER}\" -g \"${ISUREN_USER}\" \"${SCRIPT_DIR}/mise.ami.lock\" \"${lock}\"\n    log \"mise lock: changed ${lock}\"\n  else\n    log \"mise lock: already up to date\"\n  fi\n}\n\n# mise install自体が内部で冪等(既にインストール済みのバージョンは再取得しない)なため、\n# ここでは changed/already の判定を自前で行わずmiseに委ねる。\nrun_mise_install() {\n  runuser -u \"${ISUREN_USER}\" -- \"${MISE_BIN}\" install\n  log \"mise install: done\"\n}\n\ninstall_mise\nset_bashrc\nset_mise_config\nset_mise_lock\nrun_mise_install\n\nlog \"30-runtime.sh: done\"\n"
- path: /opt/kakomon14/provisioning/40-mysql.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\n# 対応: isucon14/provisioning/ansible/roles/mysql/tasks/main.yml L1-5\n# 2回目以降にネットワークへ出ないよう、未インストールのときだけapt-get updateする。\ninstall_mysql() {\n  if ! dpkg -s mysql-server >/dev/null 2>&1; then\n    apt-get update\n    apt-get install -y mysql-server\n    log \"mysql-server: installed\"\n  else\n    log \"mysql-server: already installed\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/mysql/tasks/main.yml L7-11\nstart_mysql_service() {\n  if systemctl is-active --quiet mysql && systemctl is-enabled --quiet mysql; then\n    log \"mysql service: already enabled and running\"\n  else\n    systemctl enable --now mysql\n    log \"mysql service: enabled and started\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/mysql/tasks/main.yml L13-20\n# 元のCREATE USER IF NOT EXISTSだけだと、ユーザーが既に存在する場合パスワードは更新されない。\n# ALTER USERを足すことでパスワードのドリフトも解消されるようにした。\n# CREATE/ALTER/GRANTはMySQL側で既に冪等なため、changed/already の判定は自前で行わずMySQLに委ねる。\nset_isucon_db_user() {\n  mysql -uroot -e \"\n    CREATE USER IF NOT EXISTS 'isucon'@'%' IDENTIFIED BY 'isucon';\n    ALTER USER 'isucon'@'%' IDENTIFIED BY 'isucon';\n    GRANT ALL PRIVILEGES ON *.* TO 'isucon'@'%' WITH GRANT OPTION;\n    FLUSH PRIVILEGES;\n  \"\n  log \"isucon db user: granted\"\n}\n\ninstall_mysql\nstart_mysql_service\nset_isucon_db_user\n\nlog \"40-mysql.sh: done\"\n"
- path: /opt/kakomon14/provisioning/50-source.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\n# isucon14本家への直接依存をやめ、isuren-mondai自身に取り込んだ\n# upstream/isucon14/ (go/frontend/payment_mock/openapi.yaml)を取得元にする\n# (AGENTS.md「過去問コードの取り込み(upstream)方針」)。\n: \"${UPSTREAM_REPO_URL:=https://github.com/sunakan/isuren-mondai.git}\"\n: \"${UPSTREAM_COMMIT:=d9d526895d97a3707dda96c8fa722ec15356ba44}\"\nUPSTREAM_SUBPATH=\"upstream/isucon14\"\n\n# webapp/sql(サンプルデータ)とfrontend/public(画像等の静的アセット)は自分で手を加えない\n# 読み取り専用データのため、取り込まず本家から直接sparse-checkoutで取得する\n# (upstream/isucon14/NOTICE.md参照)。\n# コミットは/Users/user01/works/github.com/isucon/isucon14のHEADに合わせて固定\n# (isucon14公式リポジトリのmainブランチ、2024-12-13時点)。\n: \"${ISUCON14_REPO_URL:=https://github.com/isucon/isucon14.git}\"\n: \"${ISUCON14_COMMIT:=53f8b627e040c30ebec600457c6c97da008b84b0}\"\nISUCON14_SUBPATHS=(\"webapp/sql\" \"frontend/public\")\n\nISUREN_HOME=\"/home/${ISUREN_USER}\"\nUPSTREAM_CHECKOUT_DIR=\"${ISUREN_HOME}/.isuren-mondai-upstream\"\nUPSTREAM_DIR=\"${UPSTREAM_CHECKOUT_DIR}/${UPSTREAM_SUBPATH}\"\nISUCON14_CHECKOUT_DIR=\"${ISUREN_HOME}/.isucon14-upstream\"\nISUCON14_LINK=\"${ISUREN_HOME}/isucon14\"\nWEBAPP_LINK=\"${ISUREN_HOME}/webapp\"\n\n# Why not curl+tar: GitHubのcodeload archiveエンドポイントはリポジトリ全体のtarballしか\n# 生成できず、サブパス指定で絞り込めない。過去問を追加するたびリポジトリは肥大化していく\n# (特にDBサンプルデータ・画像アセットが重くなりがち)ため、必要なサブツリーだけ転送する\n# sparse-checkoutを使う。\n# Why not `git clone --depth 1`: cloneはデフォルトブランチの先端しか浅く取れず、\n# 過去にピン留めした特定コミットを狙って取得できない。git init+remote add+特定SHAをfetchする\n# 構成にすることで、shallow(--depth 1)のまま任意のコミットを指定できるようにしている。\n# cone modeのsparse-checkoutはリポジトリルート直下のファイル(LICENSE等)も自動的に含むため、\n# 取得先ごとにLICENSEが自然に同梱される(MITの著作権表示同梱要件を満たす)。\n# 同じリポジトリ・同じコミットから複数パスを取りたい場合は、.gitを2つ持つ無駄を避けるため\n# 引数でサブパスを複数渡し、1つのsparse-checkoutにまとめる。\nsparse_checkout_fetch() {\n  local checkout_dir=\"$1\" repo_url=\"$2\" commit=\"$3\"\n  shift 3\n  local subpaths=(\"$@\")\n\n  if [ ! -d \"${checkout_dir}/.git\" ]; then\n    runuser -u \"${ISUREN_USER}\" -- git init --quiet \"${checkout_dir}\"\n    runuser -u \"${ISUREN_USER}\" -- git -C \"${checkout_dir}\" remote add origin \"${repo_url}\"\n    runuser -u \"${ISUREN_USER}\" -- git -C \"${checkout_dir}\" sparse-checkout set --cone \"${subpaths[@]}\"\n    log \"$(basename \"${checkout_dir}\"): initialized\"\n  fi\n\n  local current_commit\n  current_commit=\"$(runuser -u \"${ISUREN_USER}\" -- git -C \"${checkout_dir}\" rev-parse HEAD 2>/dev/null || echo \"\")\"\n  if [ \"${current_commit}\" != \"${commit}\" ]; then\n    runuser -u \"${ISUREN_USER}\" -- git -C \"${checkout_dir}\" fetch --quiet --depth 1 --filter=blob:none origin \"${commit}\"\n    runuser -u \"${ISUREN_USER}\" -- git -C \"${checkout_dir}\" checkout --quiet \"${commit}\"\n    log \"$(basename \"${checkout_dir}\"): checked out ${commit}\"\n  else\n    log \"$(basename \"${checkout_dir}\"): already at ${commit}\"\n  fi\n}\n\n# 80-frontend.shが`~/isucon14/frontend`を参照する既存の前提を変えずに済むよう、\n# 取り込んだ実体を指すシンボリックリンクを張る。\nlink_isucon14() {\n  if [ -L \"${ISUCON14_LINK}\" ] && [ \"$(readlink \"${ISUCON14_LINK}\")\" = \"${UPSTREAM_DIR}\" ]; then\n    log \"isucon14: symlink already up to date\"\n  else\n    ln -sfn \"${UPSTREAM_DIR}\" \"${ISUCON14_LINK}\"\n    log \"isucon14: symlink created\"\n  fi\n}\n\n# 70-webapp-go.sh等が`~/webapp`を参照する既存の前提を変えずに済むよう、\n# 取り込んだ実体を指すシンボリックリンクを張る。\n#\n# Why not `~/webapp`を実ディレクトリにして子要素ごとに個別リンクする方式:\n# 一度その方式で実装したが、systemdのWorkingDirectory=~/webapp/go はシンボリックリンクの\n# 実体側パスにchdirするため、webapp/goプロセスから見た`../sql`は`~/webapp/sql`ではなく\n# upstreamツリー内の(存在しない)webapp/sqlに解決されてしまい、/api/initializeが\n# `fork/exec ../sql/init.sh: no such file or directory`で失敗した。\n# sqlのシンボリックリンクをupstreamツリーの中(webapp/go と同じ実ディレクトリ)に置けば、\n# `..`の解決先がupstreamツリー内で完結するため、`~/webapp`自体は単一リンクで問題ない。\nlink_webapp() {\n  if [ -L \"${WEBAPP_LINK}\" ] && [ \"$(readlink \"${WEBAPP_LINK}\")\" = \"${UPSTREAM_DIR}/webapp\" ]; then\n    log \"webapp: symlink already up to date\"\n  else\n    ln -sfn \"${UPSTREAM_DIR}/webapp\" \"${WEBAPP_LINK}\"\n    log \"webapp: symlink\
    \ created\"\n  fi\n}\n\n# webapp/sqlとfrontend/publicは本家(isucon14公式リポジトリ)取得のため、upstreamツリーの内側に\n# シンボリックリンクで差し込む(理由はlink_webapp内のコメント参照)。\nlink_isucon14_into_upstream() {\n  local target=\"${ISUCON14_CHECKOUT_DIR}/$1\"\n  local link=\"${UPSTREAM_DIR}/$1\"\n  if [ -L \"${link}\" ] && [ \"$(readlink \"${link}\")\" = \"${target}\" ]; then\n    log \"$1: symlink already up to date\"\n  else\n    ln -sfn \"${target}\" \"${link}\"\n    log \"$1: symlink created\"\n  fi\n}\n\n# cone modeはリポジトリルート直下のファイルも自動的に含むため、isuren-mondai自身の\n# mise.toml(Packer/AWSタスク定義。kakomon14のgo/nodeとは無関係)も一緒に取得されてしまう。\n# これが~/webapp/go等でmiseを実行する際にディレクトリ探索へ引っかかり、\n# 「untrusted config」としてmiseがエラー終了する原因になるため取り除く。\nremove_upstream_root_mise_toml() {\n  local f=\"${UPSTREAM_CHECKOUT_DIR}/mise.toml\"\n  if [ -f \"${f}\" ]; then\n    rm -f \"${f}\"\n    log \"upstream: removed stray ${f}\"\n  fi\n}\n\nsparse_checkout_fetch \"${UPSTREAM_CHECKOUT_DIR}\" \"${UPSTREAM_REPO_URL}\" \"${UPSTREAM_COMMIT}\" \"${UPSTREAM_SUBPATH}\"\nsparse_checkout_fetch \"${ISUCON14_CHECKOUT_DIR}\" \"${ISUCON14_REPO_URL}\" \"${ISUCON14_COMMIT}\" \"${ISUCON14_SUBPATHS[@]}\"\nremove_upstream_root_mise_toml\nlink_isucon14\nlink_webapp\nlink_isucon14_into_upstream \"webapp/sql\"\nlink_isucon14_into_upstream \"frontend/public\"\n\nlog \"50-source.sh: done\"\n"
- path: /opt/kakomon14/provisioning/60-initdb.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\nISUREN_HOME=\"/home/${ISUREN_USER}\"\nWEBAPP_SQL_DIR=\"${ISUREN_HOME}/webapp/sql\"\n\n# 対応: isucon14/provisioning/ansible/roles/webapp/tasks/main.yaml L28-33(initilize database)\n# 本番のベンチ実行前リセット(/api/initialize)と同じ「常にDROP&CREATEしなおす」動作が正しい仕様のため、\n# 他のスクリプトと違い2回目以降もchanged/alreadyの判定はせず毎回実行する。\nreset_database() {\n  mysql -uroot -e \"DROP DATABASE IF EXISTS isuride; CREATE DATABASE IF NOT EXISTS isuride;\"\n  log \"database: dropped and recreated\"\n}\n\n# 対応: isucon14/provisioning/ansible/roles/webapp/tasks/main.yaml L34-36(initialize tables)\n# init.shは/home/isucon/env.sh(固定パス)をsourceしようとするが、bastionにはisurenしかいないため\n# 読み込まれない(デフォルト値がenv.shの内容と一致するため実害はないが、タスク方針通り明示exportする)。\nrun_init_sql() {\n  runuser -u \"${ISUREN_USER}\" -- env \\\n    ISUCON_DB_HOST=\"127.0.0.1\" \\\n    ISUCON_DB_PORT=\"3306\" \\\n    ISUCON_DB_USER=\"isucon\" \\\n    ISUCON_DB_PASSWORD=\"isucon\" \\\n    ISUCON_DB_NAME=\"isuride\" \\\n    bash \"${WEBAPP_SQL_DIR}/init.sh\"\n  log \"init.sh: executed\"\n}\n\nreset_database\nrun_init_sql\n\nlog \"60-initdb.sh: done\"\n"
- path: /opt/kakomon14/provisioning/70-webapp-go.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\nISUREN_HOME=\"/home/${ISUREN_USER}\"\nMISE_BIN=\"${ISUREN_HOME}/.local/bin/mise\"\nWEBAPP_GO_DIR=\"${ISUREN_HOME}/webapp/go\"\nSYSTEMD_UNIT=\"/etc/systemd/system/isuride-go.service\"\n\n# 対応: isucon14/provisioning/ansible/roles/webapp/tasks/go.yaml L9-15\n# 再ビルドのたびにサービス再起動が必要なため、changed/already判定はせず常にビルドする。\n# runuser経由では.bashrcを経由せずmiseがPATHに乗らないため、mise本体はフルパスで呼ぶ。\nbuild_isuride_go() {\n  # shellcheck disable=SC2016 # env経由で渡したWEBAPP_GO_DIR/MISE_BINをsh -c内で展開させる\n  runuser -u \"${ISUREN_USER}\" -- env WEBAPP_GO_DIR=\"${WEBAPP_GO_DIR}\" MISE_BIN=\"${MISE_BIN}\" \\\n    sh -c 'cd \"${WEBAPP_GO_DIR}\" && \"${MISE_BIN}\" exec -- go build -o \"${WEBAPP_GO_DIR}/isuride\" -ldflags \"-s -w\"'\n  log \"isuride-go: built\"\n}\n\n# 対応: isucon14/provisioning/ansible/roles/webapp/files/isuride-go.service\n# isucon->isurenに読み替え(User/Group/WorkingDirectory/EnvironmentFileのパス)。サービス名・ExecStartは据え置き。\n# WorkingDirectoryは/api/initializeが相対パス../sql/init.shを呼ぶため必須。\nset_systemd_unit() {\n  local content\n  content=$(\n    cat <<EOD\n[Unit]\nDescription=isuride-go\nAfter=syslog.target\nAfter=mysql.service\nRequires=mysql.service\n\n[Service]\nWorkingDirectory=${WEBAPP_GO_DIR}\nEnvironmentFile=${ISUREN_HOME}/env.sh\n\nUser=${ISUREN_USER}\nGroup=${ISUREN_USER}\nExecStart=${WEBAPP_GO_DIR}/isuride\nExecStop=/bin/kill -s QUIT \\$MAINPID\n\nRestart=on-failure\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\nEOD\n  )\n  if [ ! -f \"${SYSTEMD_UNIT}\" ] || [ \"$(cat \"${SYSTEMD_UNIT}\")\" != \"${content}\" ]; then\n    echo \"${content}\" >\"${SYSTEMD_UNIT}\"\n    systemctl daemon-reload\n    log \"systemd unit: changed ${SYSTEMD_UNIT}\"\n  else\n    log \"systemd unit: already up to date\"\n  fi\n}\n\n# 新しいバイナリを反映させるため、changed/already判定はせず常にrestartする。\nrestart_service() {\n  systemctl enable isuride-go\n  systemctl restart isuride-go\n  log \"isuride-go service: enabled and restarted\"\n}\n\nbuild_isuride_go\nset_systemd_unit\nrestart_service\n\nlog \"70-webapp-go.sh: done\"\n"
- path: /opt/kakomon14/provisioning/75-matcher.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\nISUREN_HOME=\"/home/${ISUREN_USER}\"\nSYSTEMD_UNIT=\"/etc/systemd/system/isuride-matcher.service\"\nUNIT_CHANGED=0\n\n# 対応: isucon14/provisioning/ansible/roles/webapp/files/isuride-matcher.service\n# isucon->isurenに読み替え。Go版のみに絞る方針のため、他言語(node/perl/php/python/ruby/rust)への\n# Afterは削除しisuride-go.serviceのみ残す。curl先は公式のhttps://isuride.xiv.isucon.net経由(nginx/TLS依存)\n# ではなくhttp://127.0.0.1:8080への直叩きに変更し、nginx/TLSを丸ごとバイパスする。\nset_systemd_unit() {\n  local content\n  content=$(\n    cat <<EOD\n[Unit]\nDescription=isuride-matcher\nAfter=isuride-go.service\n\n[Service]\nUser=${ISUREN_USER}\nGroup=${ISUREN_USER}\nEnvironmentFile=${ISUREN_HOME}/env.sh\n\nExecStart=/bin/sh -c \"while true; do curl -s http://127.0.0.1:8080/api/internal/matching; sleep \\$ISUCON_MATCHING_INTERVAL; done\"\nExecStop=/bin/kill -s QUIT \\$MAINPID\n\nRestart=on-failure\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\nEOD\n  )\n  if [ ! -f \"${SYSTEMD_UNIT}\" ] || [ \"$(cat \"${SYSTEMD_UNIT}\")\" != \"${content}\" ]; then\n    echo \"${content}\" >\"${SYSTEMD_UNIT}\"\n    systemctl daemon-reload\n    UNIT_CHANGED=1\n    log \"systemd unit: changed ${SYSTEMD_UNIT}\"\n  else\n    log \"systemd unit: already up to date\"\n  fi\n}\n\n# ユニットファイルが変わった場合は、稼働中でも再起動して新しい内容を反映させる\n# (enable --nowはすでに動作中のサービスに対しては何もしないため)。\nstart_service() {\n  systemctl enable isuride-matcher\n  if [ \"${UNIT_CHANGED}\" = \"1\" ] || ! systemctl is-active --quiet isuride-matcher; then\n    systemctl restart isuride-matcher\n    log \"isuride-matcher service: (re)started\"\n  else\n    log \"isuride-matcher service: already running\"\n  fi\n}\n\nset_systemd_unit\nstart_service\n\nlog \"75-matcher.sh: done\"\n"
- path: /opt/kakomon14/provisioning/77-payment-mock.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\nISUREN_HOME=\"/home/${ISUREN_USER}\"\nMISE_BIN=\"${ISUREN_HOME}/.local/bin/mise\"\nPAYMENT_MOCK_DIR=\"${ISUREN_HOME}/webapp/payment_mock\"\nSYSTEMD_UNIT=\"/etc/systemd/system/isuride-payment_mock.service\"\n\n# 対応: isucon14/provisioning/ansible/roles/webapp/tasks/payment_mock.yaml\n# webappと同じ考え方(70-webapp-go.sh)でrunuser経由でもmiseがPATHに乗るようフルパスで呼ぶ。\nbuild_payment_mock() {\n  # shellcheck disable=SC2016 # env経由で渡したPAYMENT_MOCK_DIR/MISE_BINをsh -c内で展開させる\n  runuser -u \"${ISUREN_USER}\" -- env PAYMENT_MOCK_DIR=\"${PAYMENT_MOCK_DIR}\" MISE_BIN=\"${MISE_BIN}\" \\\n    sh -c 'cd \"${PAYMENT_MOCK_DIR}\" && \"${MISE_BIN}\" exec -- go build -o \"${PAYMENT_MOCK_DIR}/payment_mock\" -ldflags \"-s -w\"'\n  log \"payment_mock: built\"\n}\n\n# 対応: isucon14/provisioning/ansible/roles/webapp/files/isuride-payment_mock.service\n# isucon->isurenに読み替え。payment_mock(main.go)はDBを一切使わない(決済履歴はプロセス内メモリのmapで\n# 保持するのみ)ため、本家unitにあるAfter=mysql.service/Requires=mysql.serviceは含めない。\n# 本家はwebapp配置候補の全サーバーにこれを常駐させ:12345固定で待ち受けさせる方式\n# (docs/ISURIDE.md「決済マイクロサービスのモックについて」)。分離サーバー構成を見据え、\n# 単一AMI構成の現状でもwebappと同様に常駐させておく。\nset_systemd_unit() {\n  local content\n  content=$(\n    cat <<EOD\n[Unit]\nDescription=isuride-payment_mock\nAfter=syslog.target\n\n[Service]\nWorkingDirectory=${PAYMENT_MOCK_DIR}\n\nUser=${ISUREN_USER}\nGroup=${ISUREN_USER}\nExecStart=${PAYMENT_MOCK_DIR}/payment_mock\nExecStop=/bin/kill -s QUIT \\$MAINPID\n\nRestart=on-failure\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\nEOD\n  )\n  if [ ! -f \"${SYSTEMD_UNIT}\" ] || [ \"$(cat \"${SYSTEMD_UNIT}\")\" != \"${content}\" ]; then\n    echo \"${content}\" >\"${SYSTEMD_UNIT}\"\n    systemctl daemon-reload\n    log \"systemd unit: changed ${SYSTEMD_UNIT}\"\n  else\n    log \"systemd unit: already up to date\"\n  fi\n}\n\n# 新しいバイナリを反映させるため、changed/already判定はせず常にrestartする(70-webapp-go.shと同じ方針)。\nrestart_service() {\n  systemctl enable isuride-payment_mock\n  systemctl restart isuride-payment_mock\n  log \"isuride-payment_mock service: enabled and restarted\"\n}\n\nbuild_payment_mock\nset_systemd_unit\nrestart_service\n\nlog \"77-payment-mock.sh: done\"\n"
- path: /opt/kakomon14/provisioning/80-frontend.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\nISUREN_HOME=\"/home/${ISUREN_USER}\"\nWEBAPP_PUBLIC_DIR=\"${ISUREN_HOME}/webapp/public\"\nBENCHRUN_DIR=\"${ISUREN_HOME}/isucon14/bench/benchrun\"\n\n# frontendはAMI上でpnpm buildせず、事前にビルドしGitHub Releaseとして公開したものを取得する\n# (t4g.smallでのpnpm installはOOMを起こしうる上、node/pnpmをAMIに含めずに済む。\n# kakomon14/scripts/build-frontend-release.sh・scripts/github-release.sh参照)。\n: \"${FRONTEND_RELEASE_REPO_URL:=https://github.com/sunakan/isuren-mondai}\"\n: \"${FRONTEND_RELEASE_OWNER_REPO:=sunakan/isuren-mondai}\"\n# デフォルトはlatest(起動のたびに最新のkakomon14-frontend-*releaseを解決)。\n# タグを明示指定すればそのバージョンにピン留めできる(例: kakomon14-frontend-v1.0.1)。\n: \"${FRONTEND_RELEASE_TAG:=latest}\"\nFRONTEND_RELEASE_DIR=\"${ISUREN_HOME}/.kakomon14-frontend-release\"\n# latest解決後の具体的なタグをPacker側(file provisioner)が回収し、AMIタグに記録するための\n# 置き場所。FRONTEND_RELEASE_TAG=latestだとAMIのディスク中身だけでは実際に焼き込まれた\n# バージョンが分からなくなるため。\nRESOLVED_TAG_FILE=\"/tmp/kakomon14-frontend-release-tag\"\n\n# 1つのリポジトリで複数過去問(kakomon13等)のReleaseを扱うため、GitHubの/releases/latest\n# (タグprefixを問わずリポジトリ全体で最新のものを返す)は使えない。releases一覧(作成日時降順)から\n# kakomon14-frontend-プレフィックスの先頭を拾う。\nresolve_frontend_release_tag() {\n  if [ \"${FRONTEND_RELEASE_TAG}\" != \"latest\" ]; then\n    return\n  fi\n  local resolved\n  resolved=\"$(curl -fsSL \"https://api.github.com/repos/${FRONTEND_RELEASE_OWNER_REPO}/releases\" |\n    grep -o '\"tag_name\": *\"kakomon14-frontend-[^\"]*\"' | head -n1 |\n    sed -E 's/.*\"(kakomon14-frontend-[^\"]*)\"$/\\1/')\"\n  if [ -z \"${resolved}\" ]; then\n    echo \"エラー: kakomon14-frontendのReleaseが見つかりませんでした(GitHub API: ${FRONTEND_RELEASE_OWNER_REPO})\" >&2\n    exit 1\n  fi\n  FRONTEND_RELEASE_TAG=\"${resolved}\"\n  log \"frontend release: latestを${FRONTEND_RELEASE_TAG}に解決\"\n}\n\n# root(cloud-init runcmd)実行のためデフォルトumaskで644になり、ssh_username(ubuntu)からの\n# file provisioner(download)で読める。\npersist_resolved_tag() {\n  echo \"${FRONTEND_RELEASE_TAG}\" >\"${RESOLVED_TAG_FILE}\"\n}\n\n# sunakan/isuren-mondaiはpublicリポジトリのため、認証なしのcurlでダウンロードできる。\ndownload_frontend_release() {\n  local base_url=\"${FRONTEND_RELEASE_REPO_URL}/releases/download/${FRONTEND_RELEASE_TAG}\"\n  runuser -u \"${ISUREN_USER}\" -- mkdir -p \"${FRONTEND_RELEASE_DIR}\"\n  local f\n  for f in kakomon14-frontend.tar.gz frontend_hashes.json frontend_files.json; do\n    runuser -u \"${ISUREN_USER}\" -- curl -fsSL -o \"${FRONTEND_RELEASE_DIR}/${f}\" \"${base_url}/${f}\"\n  done\n  log \"frontend release: downloaded ${FRONTEND_RELEASE_TAG}\"\n}\n\n# rsync --deleteで、前回分の古いファイル(ハッシュ付きファイル名が変わったもの等)を確実に除去する。\n# isurenユーザーで実行し、所有者を揃える(chownでの後追い修正を避ける)。\ndeploy_public() {\n  local staging=\"${FRONTEND_RELEASE_DIR}/public\"\n  runuser -u \"${ISUREN_USER}\" -- rm -rf \"${staging}\"\n  runuser -u \"${ISUREN_USER}\" -- mkdir -p \"${staging}\" \"${WEBAPP_PUBLIC_DIR}\"\n  runuser -u \"${ISUREN_USER}\" -- tar -xzf \"${FRONTEND_RELEASE_DIR}/kakomon14-frontend.tar.gz\" -C \"${staging}\"\n  runuser -u \"${ISUREN_USER}\" -- rsync -a --delete \"${staging}/\" \"${WEBAPP_PUBLIC_DIR}/\"\n  log \"webapp/public: deployed\"\n}\n\n# frontend_hashes.json/frontend_files.jsonはbenchがfrontendの整合性確認に使うファイル\n# (upstream/isucon14/NOTICE.md「コミット対象から外したもの」参照)。\n# 取り込み時点の古い内容の上に、ダウンロードした最新版を上書きする。\ndeploy_benchrun_manifests() {\n  local f\n  for f in frontend_hashes.json frontend_files.json; do\n    runuser -u \"${ISUREN_USER}\" -- cp \"${FRONTEND_RELEASE_DIR}/${f}\" \"${BENCHRUN_DIR}/${f}\"\n  done\n  log \"bench/benchrun manifests: deployed\"\n}\n\nresolve_frontend_release_tag\npersist_resolved_tag\ndownload_frontend_release\ndeploy_public\ndeploy_benchrun_manifests\n\nlog \"80-frontend.sh: done\"\n"
- path: /opt/kakomon14/provisioning/90-nginx.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\nISUREN_HOME=\"/home/${ISUREN_USER}\"\nWEBAPP_PUBLIC_DIR=\"${ISUREN_HOME}/webapp/public\"\nSITE_AVAILABLE=\"/etc/nginx/sites-available/isuride.conf\"\nSITE_ENABLED=\"/etc/nginx/sites-enabled/isuride.conf\"\nDEFAULT_ENABLED=\"/etc/nginx/sites-enabled/default\"\nTLS_DIR=\"/etc/nginx/tls\"\nTLS_CERT=\"${TLS_DIR}/_.xiv.isucon.net.crt\"\nTLS_KEY=\"${TLS_DIR}/_.xiv.isucon.net.key\"\n\n# 対応: isucon14/provisioning/ansible/roles/nginx/tasks/main.yaml「Install package」\n# 2回目以降にネットワークへ出ないよう、未インストールのときだけapt-get updateする。\ninstall_nginx() {\n  if ! dpkg -s nginx >/dev/null 2>&1; then\n    apt-get update\n    apt-get install -y nginx\n    log \"nginx: installed\"\n  else\n    log \"nginx: already installed\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/nginx/files/etc/nginx/tls/_.xiv.isucon.net.{crt,key}\n# 公式証明書は失効済み(2025年2月)のため自己署名で代用する。ベンチはTLS検証をしないため問題ない。\n# 有効期限が近い(30日未満)/存在しない場合のみ再生成する冪等な作りにする。\ngenerate_tls_cert() {\n  if [ \"${ENABLE_TLS}\" != \"true\" ]; then\n    return\n  fi\n  mkdir -p \"${TLS_DIR}\"\n  if [ -f \"${TLS_CERT}\" ] && openssl x509 -checkend 2592000 -noout -in \"${TLS_CERT}\" >/dev/null 2>&1; then\n    log \"nginx tls cert: already valid\"\n  else\n    openssl req -x509 -nodes -newkey rsa:2048 \\\n      -keyout \"${TLS_KEY}\" -out \"${TLS_CERT}\" \\\n      -days 3650 \\\n      -subj \"/CN=*.xiv.isucon.net\" \\\n      -addext \"subjectAltName=DNS:*.xiv.isucon.net,DNS:xiv.isucon.net\"\n    log \"nginx tls cert: generated\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/nginx/files/etc/nginx/sites-available/isuride.conf\n# 公式は443のみでTLS必須の構成だが、まずTLSなしのHTTP版で静的配信+/apiプロキシの経路を通す。\n# ボット避けのデフォルトvhost(公式L1-26)は本番運営向けのセキュリティ対策であり、\n# このbastionでは不要なため省略し、単一のHTTP vhostのみにした。\n# ENABLE_TLS=trueのときのみ、公式L28-56相当の443 vhost(xiv.isucon.net向け)を追加する。\nset_site_config() {\n  local content\n  content=$(\n    cat <<EOD\nserver {\n  listen 80 default_server;\n  server_name _;\n\n  client_max_body_size 10m;\n  root ${WEBAPP_PUBLIC_DIR};\n\n  location / {\n    try_files \\$uri /index.html;\n  }\n\n  location /api/ {\n    proxy_set_header Host \\$host;\n    proxy_pass http://localhost:8080;\n  }\n\n  location /api/internal/ {\n    # localhostからのみアクセスを許可\n    allow 127.0.0.1;\n    deny all;\n    proxy_set_header Host \\$host;\n    proxy_pass http://localhost:8080;\n  }\n}\nEOD\n  )\n  if [ \"${ENABLE_TLS}\" = \"true\" ]; then\n    content=\"${content}\n$(cat <<EOD\n\nserver {\n  listen 443 ssl;\n  server_name xiv.isucon.net;\n  server_name *.xiv.isucon.net;\n\n  ssl_certificate ${TLS_CERT};\n  ssl_certificate_key ${TLS_KEY};\n  ssl_protocols TLSv1.3;\n  ssl_prefer_server_ciphers off;\n\n  client_max_body_size 10m;\n  root ${WEBAPP_PUBLIC_DIR};\n\n  location / {\n    try_files \\$uri /index.html;\n  }\n\n  location /api/ {\n    proxy_set_header Host \\$host;\n    proxy_pass http://localhost:8080;\n  }\n\n  location /api/internal/ {\n    # localhostからのみアクセスを許可\n    allow 127.0.0.1;\n    deny all;\n    proxy_set_header Host \\$host;\n    proxy_pass http://localhost:8080;\n  }\n}\nEOD\n)\"\n  fi\n  if [ ! -f \"${SITE_AVAILABLE}\" ] || [ \"$(cat \"${SITE_AVAILABLE}\")\" != \"${content}\" ]; then\n    echo \"${content}\" >\"${SITE_AVAILABLE}\"\n    log \"nginx site config: changed ${SITE_AVAILABLE}\"\n  else\n    log \"nginx site config: already up to date\"\n  fi\n}\n\nenable_site() {\n  if [ ! -L \"${SITE_ENABLED}\" ] || [ \"$(readlink \"${SITE_ENABLED}\")\" != \"${SITE_AVAILABLE}\" ]; then\n    ln -sfn \"${SITE_AVAILABLE}\" \"${SITE_ENABLED}\"\n    log \"nginx site: enabled\"\n  else\n    log \"nginx site: already enabled\"\n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/nginx/tasks/main.yaml「Delete default config」\nremove_default_site() {\n  if [ -e \"${DEFAULT_ENABLED}\" ] || [ -L \"${DEFAULT_ENABLED}\" ]; then\n    rm -f \"${DEFAULT_ENABLED}\"\n    log \"nginx default site: removed\"\n  else\n    log \"nginx default site: already removed\"\
    \n  fi\n}\n\n# 対応: isucon14/provisioning/ansible/roles/nginx/tasks/main.yaml「check nginx config」「Start nginx」\nreload_nginx() {\n  nginx -t\n  systemctl enable nginx\n  systemctl reload-or-restart nginx\n  log \"nginx: reloaded\"\n}\n\ninstall_nginx\ngenerate_tls_cert\nset_site_config\nenable_site\nremove_default_site\nreload_nginx\n\nlog \"90-nginx.sh: done\"\n"
- path: /opt/kakomon14/provisioning/95-deploy-helper.sh
  owner: root:root
  permissions: '0644'
  content: "#!/usr/bin/env bash\nset -euo pipefail\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n# shellcheck source=./lib.sh\nsource \"${SCRIPT_DIR}/lib.sh\"\n\nISUREN_HOME=\"/home/${ISUREN_USER}\"\nDEPLOY_SCRIPT=\"${ISUREN_HOME}/deploy.sh\"\n\n# チューニング作業中に、コード変更→再ビルド→再起動を1コマンドで回せるようにする。\n# isurenの対話シェル(.bashrcでmise activate済み)からの実行を前提にしており、\n# 70-webapp-go.shのようにmise/goをフルパス指定していない。\nset_deploy_script() {\n  local content\n  content=$(\n    cat <<'EOD'\n#!/usr/bin/env bash\nset -euo pipefail\n\ncd ~/webapp/go\nmise exec -- go build -o isuride -ldflags \"-s -w\"\nsudo systemctl restart isuride-go\necho \"deploy.sh: isuride-go restarted\"\nEOD\n  )\n  if [ ! -f \"${DEPLOY_SCRIPT}\" ] || [ \"$(cat \"${DEPLOY_SCRIPT}\")\" != \"${content}\" ]; then\n    echo \"${content}\" >\"${DEPLOY_SCRIPT}\"\n    chown \"${ISUREN_USER}:${ISUREN_USER}\" \"${DEPLOY_SCRIPT}\"\n    chmod 0755 \"${DEPLOY_SCRIPT}\"\n    log \"deploy.sh: changed ${DEPLOY_SCRIPT}\"\n  else\n    log \"deploy.sh: already up to date\"\n  fi\n}\n\nset_deploy_script\n\nlog \"95-deploy-helper.sh: done\"\n"
- path: /opt/kakomon14/provisioning/all.sh
