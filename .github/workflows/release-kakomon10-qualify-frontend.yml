name: release-kakomon10-qualify-frontend

on:
  push:
    tags:
      # 他の過去問のタグでは起動しない。build/release taskはkakomon10-qualify専用である。
      - "kakomon10-qualify-frontend-v*"

permissions: {}

concurrency:
  group: release-kakomon10-qualify-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish KAKOMON10-QUALIFY frontend + initial data
    # AMIと同じUbuntu 26.04 arm64。build scriptがsudoでmysql-serverを導入し、
    # bench検証用データ(verification_data)生成のため一時的にwebappを起動する。
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: write # gh release createで、このtagのReleaseとassetを作成するため。
    env:
      # checkout直後のmise設定がuntrusted扱いで止まらないようrepositoryだけを信頼する。
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後続のremote確認はpublic repositoryへの匿名アクセスで足りる。
          persist-credentials: false

      # Node 14.9.0とGo 1.26.6の導入はkakomon10-qualifyのbuild scriptが
      # scripts/mise.lockを使って行う。タグpush workflowではcacheを共有せず、
      # release入力を毎回作り直す。
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: false

      # ローカル運用と同じtaskでbuildしてから、同じKAKOMON10-QUALIFY tagのGitHub
      # Releaseへuploadする。taskは依存取得/build中のRelease tokenを遮断し、
      # upload時だけ子processへ渡す。
      - run: mise run kakomon10-qualify:release "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
