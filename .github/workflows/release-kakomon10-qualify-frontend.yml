name: release-kakomon10-qualify-frontend

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "補完後の新tag（事前にpushしない）"
        required: true
        type: string
        default: kakomon10-qualify-frontend-v1.0.1
      base_tag:
        description: "保持する公開済みReleaseのexact tag"
        required: true
        type: string
        default: kakomon10-qualify-frontend-v1.0.0
      base_sha256:
        description: "元archiveの公開済みSHA-256"
        required: true
        type: string
        default: c47cced37f96028c7a48799a46dc9c84f3efddec37670889a43d069949d76d3c
  push:
    tags:
      # 他の過去問のタグでは起動しない。build/release taskはkakomon10-qualify専用である。
      - "kakomon10-qualify-frontend-v*"

permissions: {}

concurrency:
  group: release-kakomon10-qualify-frontend-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish KAKOMON10-QUALIFY frontend + initial data
    # AMIと同じUbuntu 26.04 arm64。build scriptがsudoでmysql-serverを導入し、
    # bench検証用データ(verification_data)生成のため一時的にwebappを起動する。
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: write # gh release createで、このtagのReleaseとassetを作成するため。
    env:
      # checkout直後のmise設定がuntrusted扱いで止まらないようrepositoryだけを信頼する。
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後続のremote確認はpublic repositoryへの匿名アクセスで足りる。
          persist-credentials: false

      # Node 14.9.0とGo 1.26.6の導入はkakomon10-qualifyのbuild scriptが
      # scripts/mise.lockを使って行う。タグpush workflowではcacheを共有せず、
      # release入力を毎回作り直す。
      - if: github.event_name == 'push'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: false

      # ローカル運用と同じtaskでbuildしてから、同じKAKOMON10-QUALIFY tagのGitHub
      # Releaseへuploadする。taskは依存取得/build中のRelease tokenを遮断し、
      # upload時だけ子processへ渡す。
      - if: github.event_name == 'push'
        run: mise run kakomon10-qualify:release "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}

      # 既存のSQL/JSON/fixture/draft全bytesが一致した場合だけ欠落2fileを補完する。
      # frontendとsnapshotは保持し、未使用の新tagへだけ公開する。
      - if: github.event_name == 'workflow_dispatch'
        run: bash mise-tasks/kakomon10-qualify/repair-frontend "$REPAIR_TAG" "$BASE_TAG" "$BASE_SHA256"
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_TAG: ${{ inputs.release_tag }}
          BASE_TAG: ${{ inputs.base_tag }}
          BASE_SHA256: ${{ inputs.base_sha256 }}
