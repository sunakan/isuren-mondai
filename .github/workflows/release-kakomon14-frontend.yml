name: release-kakomon14-frontend

on:
  push:
    tags:
      # kakomon13等、他の過去問のタグで誤発火しないよう固定文字列にする
      # (ワークフロー内のパスがkakomon14決め打ちのため)。
      - "kakomon14-frontend-v*"

permissions:
  contents: write

jobs:
  release:
    # AMIの実行環境(arm64)とビルド環境を揃える。sunakan/isuren-mondaiはpublicリポジトリのため
    # arm64ランナーは無料。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      # checkout直後のmise設定はuntrusted扱いで止まるため。
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      # 後続のgit ls-remote等はpublicリポジトリへの匿名アクセスで足りるため、
      # 認証情報の永続化(persist-credentials)は不要かつghalint/zizmorの指摘対象。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ツール導入(node/pnpm)はkakomon14/scripts/build-frontend-release.shが
      # MISE_CONFIG_FILE付きで自前で行うため、ここではmise本体のみ用意する。
      # cache: false — タグpush(公開)ワークフローでのcache poisoning対策(zizmor cache-poisoning指摘)。
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: false

      # build-frontend-release.shはscripts/lib.shのrequire_pushed_commit(gh api呼び出し)を
      # 経由するため、このstepにもGH_TOKENが要る。
      - run: mise run build-frontend-kakomon14
        env:
          GH_TOKEN: ${{ github.token }}

      # GH_TOKENは使うstepだけに置き、job全体のenvには置かない
      # (ghalintのjob_secretsポリシー: github.tokenをjob envに置かない)。
      - run: |
          scripts/github-release.sh "${GITHUB_REF_NAME}" \
            kakomon14/dist/kakomon14-frontend.tar.gz \
            kakomon14/dist/frontend_hashes.json \
            kakomon14/dist/frontend_files.json
        env:
          GH_TOKEN: ${{ github.token }}
