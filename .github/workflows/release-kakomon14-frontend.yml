name: release-kakomon14-frontend

on:
  push:
    tags:
      # 他の過去問のタグでは起動しない。build/release taskはkakomon14専用である。
      - "kakomon14-frontend-v*"

permissions: {}

concurrency:
  group: release-kakomon14-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish KAKOMON14 frontend
    # AMIと同じUbuntu 26.04 arm64で、KAKOMON14が固定したNode/pnpmのbuildを検証する。
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: write # gh release createで、このtagのReleaseとassetを作成するため。
    env:
      # checkout直後のmise設定がuntrusted扱いで止まらないようrepositoryだけを信頼する。
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後続のremote確認はpublic repositoryへの匿名アクセスで足りる。
          persist-credentials: false

      # Node 24.19.0/pnpm 11.21.0の導入はKAKOMON14のbuild scriptがmise.lockを使って行う。
      # タグpush workflowではcacheを共有せず、release入力を毎回作り直す。
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: false

      # ローカル運用と同じtaskでbuildしてから、同じKAKOMON14 tagのGitHub Releaseへuploadする。
      # taskは依存取得/build中のRelease tokenを遮断し、upload時だけ子processへ渡す。
      - run: mise run kakomon14:release "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
