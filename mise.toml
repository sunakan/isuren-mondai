[tools]
"aqua:mvdan/sh" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:actionlint" = "latest"
"aqua:zizmor" = "latest"
"aqua:ghalint" = "latest"
"aqua:suzuki-shunsuke/pinact" = "latest"

[env]
AWS_REGION = "ap-northeast-1"
PACKER_NETWORK_STACK_NAME = "isuren-mondai-packer-network"

[tasks.lock-tools]
description = "mise.tomlのtoolsをlinux-arm64/macos-arm64向けにlock(windows等は含めない)"
run = "mise lock -p linux-arm64,macos-arm64"

[tasks.shellcheck]
description = "shellスクリプトをshellcheckで検査(取り込んだ本家コードのupstream/配下は対象外)"
run = "find . -name '*.sh' -not -path '*/upstream/*' -print0 | xargs -0 shellcheck"

[tasks.shfmt]
description = "shellスクリプトをshfmtでフォーマットチェック(取り込んだ本家コードのupstream/配下は対象外)"
run = "find . -name '*.sh' -not -path '*/upstream/*' -print0 | xargs -0 shfmt -d"

[tasks.actionlint]
description = "GitHub Actionsワークフローをactionlintで検査"
run = "actionlint"

[tasks.zizmor]
description = "GitHub Actionsワークフローをzizmorでセキュリティ監査"
run = "zizmor .github/workflows"

[tasks.ghalint]
description = "GitHub Actionsワークフローをghalintでポリシー検査"
run = "ghalint run"

[tasks.pinact]
description = "GitHub Actionsのaction参照がSHA pinされているかをpinactで検査(--checkのため書き換えない)"
run = "pinact run --check"

[tasks.ci]
description = "shellcheck/shfmt/actionlint/zizmor/ghalint/pinactを並行実行する(1つが失敗しても他は完走させる)"
depends = ["shellcheck", "shfmt", "actionlint", "zizmor", "ghalint", "pinact"]

[tasks.up-packer-network]
description = "Packerビルド用の永続VPCをデプロイ"
run = '''
#!/usr/bin/env bash
set -euo pipefail
aws cloudformation deploy \
  --stack-name "$PACKER_NETWORK_STACK_NAME" \
  --template-file packer-network.yaml
'''

[tasks.down-packer-network]
description = "Packerビルド用の永続VPCを削除"
run = '''
#!/usr/bin/env bash
set -euo pipefail
aws cloudformation delete-stack --stack-name "$PACKER_NETWORK_STACK_NAME"
aws cloudformation wait stack-delete-complete --stack-name "$PACKER_NETWORK_STACK_NAME"
'''

[tasks.build-kakomon14]
description = "kakomon14/packerでpacker buildを実行(cloud-initでisucon14(Go)をプロビジョニング)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
VPC_ID="$(aws cloudformation describe-stacks \
  --stack-name "$PACKER_NETWORK_STACK_NAME" \
  --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" --output text)"
SUBNET_ID="$(aws cloudformation describe-stacks \
  --stack-name "$PACKER_NETWORK_STACK_NAME" \
  --query "Stacks[0].Outputs[?OutputKey=='SubnetId'].OutputValue" --output text)"
# user-data.yaml.gzはprovisioning/配下から再生成可能なためgit管理していない。
# ビルドのたびに最新化することで、生成し忘れによる古いuser-dataでのビルドを防ぐ。
python3 kakomon14/cloud-init/generate-user-data.py
cd kakomon14/packer
packer build -var "vpc_id=$VPC_ID" -var "subnet_id=$SUBNET_ID" empty.pkr.hcl
'''

[tasks.build-frontend-kakomon14]
description = "kakomon14のfrontendをビルドし、kakomon14/dist/にビルド成果物を出力"
run = "kakomon14/scripts/build-frontend-release.sh"

[tasks.release-kakomon14]
description = "kakomon14のビルド成果物をGitHub Releaseへアップロード(引数: タグ名。例: mise run release-kakomon14 kakomon14-v1.0.0)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
TAG="${1:?タグ名を指定してください(例: mise run release-kakomon14 kakomon14-v1.0.0)}"
# 時間のかかるビルドを始める前にタグの重複を検知したいため、depends(常にビルドが先に走る)
# ではなくここで明示的に順序を制御する。
# shellcheck source=scripts/lib.sh
source scripts/lib.sh
require_tag_absent_or_at_head "$TAG"

mise run build-frontend-kakomon14
scripts/github-release.sh "$TAG" \
  kakomon14/dist/kakomon14-frontend.tar.gz \
  kakomon14/dist/frontend_hashes.json \
  kakomon14/dist/frontend_files.json
'''

[tasks.verify-ami]
description = "AMI_IDを指定してEC2を起動し、起動確認する(使い捨て)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
AMI_ID="${1:?AMI_IDを指定してください(例: mise run verify-ami ami-xxxxx)}"
SUBNET_ID="$(aws cloudformation describe-stacks \
  --stack-name "$PACKER_NETWORK_STACK_NAME" \
  --query "Stacks[0].Outputs[?OutputKey=='SubnetId'].OutputValue" --output text)"
aws cloudformation deploy \
  --stack-name "verify-ami-${AMI_ID}" \
  --template-file verify-ami.yaml \
  --parameter-overrides AmiId="$AMI_ID" SubnetId="$SUBNET_ID" \
  --capabilities CAPABILITY_IAM
'''

[tasks.down-verify-ami]
description = "verify-ami stackを一覧から選んで削除"
interactive = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
STACK_NAME="$(aws cloudformation describe-stacks \
  --query "Stacks[?starts_with(StackName, 'verify-ami-')].StackName" --output text | tr '\t' '\n' | fzf)"
if [ -z "$STACK_NAME" ]; then
  echo "選択されませんでした" >&2
  exit 1
fi
aws cloudformation delete-stack --stack-name "$STACK_NAME"
aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
'''
