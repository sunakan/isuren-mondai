monorepo_root = true

[monorepo]
config_roots = ["kakomon14/scripts"]

# CIツール類はアプリの実行に関与しないため、goと違い厳密なバージョン固定はせずlatestにする。
# 実際の再現性・改ざん検知はmise.lockのチェックサム固定で担保する(mise run lock-tools参照)。
[tools]
"aqua:mvdan/sh" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:actionlint" = "latest"
"aqua:zizmor" = "latest"
"aqua:ghalint" = "latest"
"aqua:suzuki-shunsuke/pinact" = "latest"
# kakomon14:buildがPacker AMIビルドのOTel trace送信に使う(Mac側のみ。EC2側には入れない)。
"aqua:equinix-labs/otel-cli" = "latest"

[env]
AWS_REGION = "ap-northeast-1"
PACKER_NETWORK_STACK_NAME = "isuren-mondai-packer-network"
